<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Sowmiya - ML engineer banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a2540"/>
      <stop offset="0.5" stop-color="#2d5b86"/>
      <stop offset="0.78" stop-color="#f0885a"/>
      <stop offset="1" stop-color="#ffc47a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7a96"/>
      <stop offset="1" stop-color="#08243f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0c8" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffc47a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffc47a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="aboveSea"><rect x="0" y="0" width="1280" height="228"/></clipPath>
  </defs>

  <rect width="1280" height="320" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff" opacity="0.75">
    <circle cx="520" cy="30" r="1.3"/><circle cx="640" cy="64" r="1"/><circle cx="780" cy="26" r="1.4"/>
    <circle cx="1130" cy="40" r="1.2"/><circle cx="1220" cy="84" r="1"/><circle cx="900" cy="48" r="1"/>
  </g>

  <!-- clouds -->
  <g fill="#fff" opacity="0.14">
    <ellipse cx="640" cy="120" rx="90" ry="14"/><ellipse cx="690" cy="108" rx="60" ry="12"/>
    <ellipse cx="1170" cy="130" rx="100" ry="15"/><ellipse cx="1120" cy="118" rx="60" ry="11"/>
  </g>

  <!-- sun -->
  <g clip-path="url(#aboveSea)">
    <circle cx="985" cy="228" r="190" fill="url(#glow)"/>
    <circle cx="985" cy="228" r="84" fill="#fff0c8"/>
  </g>

  <!-- sea -->
  <rect x="0" y="228" width="1280" height="92" fill="url(#sea)"/>
  <!-- sun reflection -->
  <g fill="#ffe3a8" opacity="0.5">
    <rect x="945" y="236" width="80" height="3" rx="1.5"/>
    <rect x="955" y="248" width="60" height="3" rx="1.5"/>
    <rect x="963" y="260" width="44" height="3" rx="1.5"/>
    <rect x="970" y="273" width="30" height="3" rx="1.5"/>
  </g>

  <!-- ship (plain sailing ship silhouette) -->
  <g fill="#0b1a2b">
    <path d="M896 224 L1076 224 Q1060 252 1018 256 L954 256 Q912 252 896 224 Z"/>
    <rect x="946" y="128" width="5" height="98"/>
    <rect x="983" y="106" width="5" height="120"/>
    <rect x="1022" y="134" width="5" height="92"/>
    <path d="M958 118 Q986 128 1014 118 L1012 172 Q986 182 960 172 Z" transform="translate(-3 0)"/>
    <path d="M953 180 Q986 190 1019 180 L1022 218 Q986 228 950 218 Z" transform="translate(-3 0)"/>
    <path d="M918 144 Q946 152 944 150 L944 192 Q930 196 918 192 Z" opacity="0.95"/>
    <path d="M1030 150 Q1048 156 1062 152 L1060 196 Q1046 200 1030 196 Z" opacity="0.95"/>
    <path d="M1076 224 L1118 206 L1076 214 Z"/>
    <path d="M896 224 L872 232 L900 230 Z"/>
  </g>
  <path d="M988 106 L988 92 L1012 99 Z" fill="#ff5a5f"/>

  <!-- gulls -->
  <g fill="none" stroke="#0b1a2b" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M760 90 q8 -9 16 0 q8 -9 16 0"/>
    <path d="M820 120 q6 -7 12 0 q6 -7 12 0"/>
    <path d="M1150 80 q7 -8 14 0 q7 -8 14 0"/>
  </g>

  <!-- waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-80 246 q20 -6 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke-width="2" opacity="0.22">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 0" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 270 q20 -7 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke-width="2.5" opacity="0.18">
      <animateTransform attributeName="transform" type="translate" values="80 0; 0 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M-80 296 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" stroke-width="3" opacity="0.14">
      <animateTransform attributeName="transform" type="translate" values="0 0; 80 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title -->
  <text x="84" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#fff">Sowmiya</text>
  <text x="86" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#ffe6c4">ML engineer · embeddings · ranking · LLM agents</text>
  <text x="86" y="244" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#ffe6c4" opacity="0.8" letter-spacing="3">SETTING SAIL INTO AI</text>
</svg>
